name: CI - Gestão Urbana

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar lint (Ruff + Pylint)
        run: make lint

      - name: Verificar projeto Django
        run: python manage.py check

      - name: Construir documentação (MkDocs)
        run: make docs-build

      # Ativar o gate de cobertura >= 80% assim que os stubs da Sprint 1 forem implementados:
      # - name: Executar testes com cobertura (>= 80%)
      #   run: make test
      - name: Coletar testes Pytest
        run: pytest --collect-only
